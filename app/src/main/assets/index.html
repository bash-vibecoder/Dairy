<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Diary</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <script defer src="app.js"></script>
</head>
<body>
<div id="appShell" class="app-shell">
<div id="app">
  <header class="topbar">
    <div class="brand-mark" aria-hidden="true">✎</div>
    <div class="brand-copy"><strong>Diary</strong><span>private · offline</span></div>
    <div class="top-date" id="topDate" aria-live="polite"></div>
    <button class="icon-button" id="menuButton" data-open-menu aria-label="Open menu" aria-controls="menuPopover" aria-expanded="false" title="Menu"><svg class="menu-dots" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
  </header>

  <section class="date-card" aria-label="Selected diary date">
    <button class="day-arrow" id="previousDay" aria-label="Previous day" title="Previous day">‹</button>
    <div class="date-main">
      <div class="date-kicker" id="dateKicker">TODAY</div>
      <div class="date-title" id="dateTitle">Wednesday, November 18</div>
      <div class="date-subtitle" id="dateSubtitle">27 Aban 1404 · 14:32</div>
    </div>
    <div class="date-state"><span id="lockIcon">●</span><span id="dateStateText">Editable</span></div>
  </section>

  <main class="editor-shell">
    <div class="editor-heading">
      <span class="entry-label" id="entryLabel">TODAY'S ENTRY</span>
      <span class="save-state" id="saveState"><i class="status-dot"></i><span>Ready</span></span>
    </div>
    <div class="editor-wrap" id="editorWrap">
      <div id="lineNumbers" class="line-numbers" aria-hidden="true">1</div>
      <pre id="editorHighlight" class="editor-highlight" aria-hidden="true" hidden></pre>
      <textarea id="editor" dir="auto" spellcheck="true" autocapitalize="sentences" autocomplete="off" placeholder="Write about your day…" aria-label="Diary entry"></textarea>
    </div>
    <div class="editor-footer">
      <span id="entryMeta">0 words · 0 characters</span>
      <button id="savedAt" type="button" aria-haspopup="dialog" title="Show this day's autosave times">Not saved yet</button>
    </div>
  </main>

</div>

<section id="calendarPage" class="calendar-page" hidden aria-label="Calendar">
  <header class="calendar-page-header">
    <button id="calendarBack" aria-label="Back to diary" title="Back to diary">‹</button>
    <strong>Calendar</strong>
    <button class="icon-button calendar-menu-button" id="calendarMenuButton" data-open-menu aria-label="Open menu" aria-controls="menuPopover" aria-expanded="false" title="Menu"><svg class="menu-dots" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
  </header>
  <div id="calendarContent" class="calendar-content"></div>
</section>

<nav class="bottom-nav" aria-label="Diary navigation">
  <button data-action="previous" id="bottomPrevious"><span class="nav-icon">‹</span><span>Previous</span></button>
  <button data-action="today" id="bottomToday"><span class="nav-icon calendar-icon">●</span><span>Today</span></button>
  <button data-action="calendar" id="bottomCalendar"><span class="nav-icon">▦</span><span>Calendar</span></button>
  <button data-action="entries" id="bottomEntries"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><span>Entries</span></button>
</nav>
</div>

<div id="menuPopover" class="menu-popover" hidden>
  <button data-action="today">Go to today</button>
  <button data-action="calendar">Open calendar</button>
  <button data-action="entries">Browse entries</button>
  <div class="menu-divider"></div>
  <button data-action="export">Export diary</button>
  <button id="menuDarkMode" data-action="darkMode" aria-pressed="false"><span>Dark mode</span><span id="darkModeValue" class="menu-value">Off</span></button>
  <button id="menuClockFormat" data-action="clockFormat"><span>Clock format</span><span id="clockFormatValue" class="menu-value">24-hour</span></button>
  <button data-action="about">About Diary</button>
</div>

<div id="dialogBackdrop" class="dialog-backdrop" hidden>
  <section id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <header><strong id="dialogTitle">Diary</strong><button id="dialogClose" aria-label="Close">×</button></header>
    <div id="dialogBody"></div>
    <footer id="dialogActions"></footer>
  </section>
</div>
<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
</body>
</html>
